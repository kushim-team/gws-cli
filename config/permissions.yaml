roles:
  admin:
    scopes:
      - "https://www.googleapis.com/auth/drive"
      - "https://www.googleapis.com/auth/spreadsheets"
      - "https://www.googleapis.com/auth/documents"
      - "https://www.googleapis.com/auth/presentations"
      - "https://www.googleapis.com/auth/tasks"
    method:
      # =============================================
      # Drive v3 (6 — files 操作のみ残存)
      # Calendar/Gmail は専用コネクタで完全代替のため全削除
      # その他の Drive リソース（changes, comments, drives,
      # permissions, replies, revisions, teamdrives 等）も削除
      # =============================================
      - "drive.files.list"
      - "drive.files.get"
      - "drive.files.create"
      - "drive.files.copy"
      - "drive.files.update"
      - "drive.files.export"

      # =============================================
      # Sheets v4 (11 — DataFilter/developerMetadata 系を削除)
      # =============================================
      - "sheets.spreadsheets.batchUpdate"
      - "sheets.spreadsheets.create"
      - "sheets.spreadsheets.get"
      - "sheets.spreadsheets.sheets.copyTo"
      - "sheets.spreadsheets.values.append"
      - "sheets.spreadsheets.values.batchClear"
      - "sheets.spreadsheets.values.batchGet"
      - "sheets.spreadsheets.values.batchUpdate"
      - "sheets.spreadsheets.values.clear"
      - "sheets.spreadsheets.values.get"
      - "sheets.spreadsheets.values.update"

      # =============================================
      # Docs v1 (3/3 — 全許可) [変更なし]
      # =============================================
      - "docs.documents.batchUpdate"
      - "docs.documents.create"
      - "docs.documents.get"

      # =============================================
      # Slides v1 (5/5 — 全許可) [変更なし]
      # =============================================
      - "slides.presentations.batchUpdate"
      - "slides.presentations.create"
      - "slides.presentations.get"
      - "slides.presentations.pages.get"
      - "slides.presentations.pages.getThumbnail"

      # =============================================
      # Tasks v1 (全許可) [変更なし]
      # =============================================
      - "tasks.tasklists.delete"
      - "tasks.tasklists.get"
      - "tasks.tasklists.insert"
      - "tasks.tasklists.list"
      - "tasks.tasklists.patch"
      - "tasks.tasklists.update"
      - "tasks.tasks.clear"
      - "tasks.tasks.delete"
      - "tasks.tasks.get"
      - "tasks.tasks.insert"
      - "tasks.tasks.list"
      - "tasks.tasks.move"
      - "tasks.tasks.patch"
      - "tasks.tasks.update"

  member:
    scopes:
      - "https://www.googleapis.com/auth/drive.readonly"
      - "https://www.googleapis.com/auth/drive.file"
      - "https://www.googleapis.com/auth/spreadsheets.readonly"
      - "https://www.googleapis.com/auth/documents.readonly"
      - "https://www.googleapis.com/auth/presentations"
      - "https://www.googleapis.com/auth/tasks.readonly"
    method:
      # Drive — 全ファイル閲覧 + MCP作成分の書き込み
      - "drive.files.list"
      - "drive.files.get"
      - "drive.files.export"
      - "drive.files.create"
      - "drive.files.update"
      # Slides — フルアクセス（作成・編集）
      - "slides.presentations.batchUpdate"
      - "slides.presentations.create"
      - "slides.presentations.get"
      - "slides.presentations.pages.get"
      - "slides.presentations.pages.getThumbnail"
      # Sheets — 閲覧のみ
      - "sheets.spreadsheets.get"
      - "sheets.spreadsheets.values.get"
      - "sheets.spreadsheets.values.batchGet"
      # Docs — 閲覧のみ
      - "docs.documents.get"
      # Tasks — 閲覧のみ
      - "tasks.tasklists.list"
      - "tasks.tasklists.get"
      - "tasks.tasks.list"
      - "tasks.tasks.get"

