name: Deploy to Cloud Run

on:
  push:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  ARTIFACT_REGISTRY: ${{ vars.GCP_REGION || 'asia-northeast1' }}-docker.pkg.dev
  IMAGE_NAME: ${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'gws-mcp' }}/gws-mcp-gateway
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'gws-mcp-gateway' }}

jobs:
  test:
    name: Pre-deploy Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: deploy-test

      - name: Run tests
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          docker build -t "${IMAGE_TAG}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_LATEST}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Resolve Cloud Run service URL
        id: service-url
        run: |
          # On first deploy the service doesn't exist yet; fall back to vars.
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)' 2>/dev/null || true)
          if [ -z "$URL" ]; then
            URL="${{ vars.GWS_GATEWAY_BASE_URL }}"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: |
            --port=8080
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=80
            --timeout=300s
            --allow-unauthenticated
          env_vars: |
            RUST_LOG=info
            GWS_GATEWAY_BASE_URL=${{ steps.service-url.outputs.url }}
            GWS_TOKEN_STORE_BACKEND=secret-manager
            GWS_SECRET_MANAGER_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GWS_SECRET_MANAGER_SECRET=${{ vars.GWS_SESSION_SECRET_ID || 'gws-mcp-sessions' }}
          secrets: |
            GOOGLE_WORKSPACE_CLI_CLIENT_ID=gws-oauth-client-id:latest
            GOOGLE_WORKSPACE_CLI_CLIENT_SECRET=gws-oauth-client-secret:latest

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Deployed to: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

      - name: Update GWS_GATEWAY_BASE_URL if changed
        run: |
          # After first deploy, the URL becomes known. Update the env var
          # so it matches the actual service URL for subsequent requests.
          CURRENT=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(spec.template.spec.containers[0].env.value)' 2>/dev/null \
            | grep -oP 'https://[^ ]+' || true)
          if [ -n "$SERVICE_URL" ] && [ "$CURRENT" != "$SERVICE_URL" ]; then
            gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
              --region=${{ env.GCP_REGION }} \
              --update-env-vars="GWS_GATEWAY_BASE_URL=${SERVICE_URL}" \
              --quiet
            echo "Updated GWS_GATEWAY_BASE_URL to ${SERVICE_URL}"
          fi

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SERVICE_URL}/.well-known/oauth-authorization-server")
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Health check failed with status ${STATUS}"
            exit 1
          fi
          echo "Health check passed (HTTP ${STATUS})"
